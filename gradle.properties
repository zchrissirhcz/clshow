# Gradle 运行内存
org.gradle.jvmargs=-Xmx4096m

# 不在此硬编码 JDK 路径（Windows 路径会破坏 Linux CI）。
# 本地用 build-app.py 构建（其会自动把 JAVA_HOME 指到 C:\soft\jdk-21），
# CI 由 actions/setup-java 提供 JDK 21，Gradle 都会从 JAVA_HOME 取 JDK。
# 如需在 Android Studio 里直接构建，请在 Settings > Gradle 里指定 JDK 21。

# 使用 PATH 中的 CMake/Ninja，避免 Android Studio 下载
# （配合 local.properties 的 cmake.dir，AGP 不再从 SDK 拉取 cmake/ninja）
org.gradle.caching=false